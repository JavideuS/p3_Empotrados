; Práctica 3 — Vending machine controller
; Two environments share the same code:
;   uno   → real board (DHT11)
;   wokwi → simulator (Wokwi only has a DHT22). Build this one before F1 → "Wokwi: Start Simulator"

[env]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
lib_deps =
    ivanseidel/ArduinoThread
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    arduino-libraries/LiquidCrystal

[env:uno]
; Never fall back to /dev/ttyS* (built-in serial) when the board is missing
upload_port = /dev/ttyACM*

[env:wokwi]
build_flags = -DSIMULATION
